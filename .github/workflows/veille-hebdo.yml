name: Envoyer la Veille par Email

on:
  workflow_dispatch:
    inputs:
      html_content:
        description: "Contenu HTML de la veille (base64)"
        required: true

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Décoder et envoyer la veille
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          echo "${{ github.event.inputs.html_content }}" | base64 -d > veille.html
          python3 - <<'EOF'
          import smtplib, os, base64
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import date

          FROM     = "julien.pajor@naxos.fr"
          PASSWORD = os.environ["EMAIL_PASSWORD"]
          TO       = ["julien.pajor@naxos.fr"]
          today    = date.today().strftime("%d %B %Y")

          msg = MIMEMultipart("mixed")
          msg["From"]    = FROM
          msg["To"]      = ", ".join(TO)
          msg["Subject"] = f"Veille Immobilier & Proptech — {today}"
          msg.attach(MIMEText(
              f"Bonjour,\n\nVeuillez trouver en pièce jointe la veille du {today}.\n\nBonne lecture,\nNaxos",
              "plain", "utf-8"
          ))
          with open("veille.html", "rb") as f:
              part = MIMEBase("application", "octet-stream")
              part.set_payload(f.read())
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", f'attachment; filename="veille-{today}.html"')
          msg.attach(part)

          with smtplib.SMTP("smtp.office365.com", 587) as s:
              s.ehlo(); s.starttls(); s.ehlo()
              s.login(FROM, PASSWORD)
              s.sendmail(FROM, TO, msg.as_string())
          print("✅ Email envoyé !")
          EOF
